<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tu cita — MOTOPARTES</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#000000"/>
  <meta property="og:type" content="website"/>
  <meta property="og:locale" content="es_MX"/>
  <meta property="og:site_name" content="MOTOPARTES"/>
  <meta property="og:title" content="Tu cita en MOTOPARTES"/>
  <meta property="og:image" content="https://vc.motopartes.cloud/img/og-logo.jpg"/>
  <meta property="og:image:type" content="image/jpeg"/>
  <meta property="og:image:width" content="800"/>
  <meta property="og:image:height" content="800"/>
  <meta property="og:image:alt" content="Logo de MOTOPARTES"/>
  <meta name="twitter:card" content="summary"/>
  <meta property="og:description" content="Consulta el estado de tu cita, acepta una propuesta o cámbiala."/>
  <link rel="icon" type="image/png" href="/img/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css?v=20261108b"/>
</head>
<body class="cp-body">

<header class="cp-top">
  <a href="/" class="cp-brand" aria-label="MOTOPARTES">MOTO<span>PARTES</span></a>
</header>

<main class="cp-main">
  <div class="cp-wrap">

    <div id="cpLoading" class="cp-loading" role="status">Cargando tu cita…</div>

    <section id="cpCard" class="cp-card" hidden>
      <span id="cpChip" class="cp-chip"></span>
      <h1 id="cpTitle" class="cp-title"></h1>
      <p id="cpLead" class="cp-lead"></p>

      <!-- Propuesta del taller -->
      <div id="cpProposal" class="cp-proposal" hidden>
        <div class="cp-proposal-h">Nueva fecha propuesta</div>
        <div class="cp-proposal-d" id="cpPropDate"></div>
        <div class="cp-proposal-t" id="cpPropTime"></div>
        <p class="cp-proposal-n" id="cpPropNote" hidden></p>
        <p class="cp-proposal-v" id="cpPropVence"></p>
      </div>

      <dl id="cpSum" class="cp-sum"></dl>

      <div id="cpActions" class="cp-actions"></div>

      <!-- Elegir otra fecha -->
      <div id="cpPicker" class="cp-picker" hidden>
        <h2 class="cp-picker-h">Elige tu nueva fecha</h2>
        <label class="cp-label" for="cpDateBtn">Fecha</label>
        <button type="button" class="pick" id="cpDateBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="cpCal">
          <span id="cpDateTxt" class="pick-ph">Toca para elegir el día</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        </button>
        <input type="hidden" id="cpDate"/>
        <div class="cal" id="cpCal" role="dialog" aria-label="Elige el día" hidden></div>
        <p id="cpPickHint" class="cp-hint" hidden></p>
        <div id="cpSlots" class="cp-slots" role="radiogroup" aria-label="Horarios disponibles"></div>
        <div class="cp-actions">
          <button type="button" class="btn btn-red" id="cpSend" disabled>Enviar esta fecha</button>
          <button type="button" class="cp-link" id="cpPickCancel">Volver</button>
        </div>
      </div>

      <p id="cpMsg" class="cp-msg" role="status" hidden></p>
    </section>

    <section id="cpError" class="cp-card" hidden>
      <span class="cp-chip cp-chip-bad">No encontrada</span>
      <h1 class="cp-title">No encontramos tu cita</h1>
      <p class="cp-lead" id="cpErrText">Revisa que el enlace esté completo. Si el problema sigue, escríbenos por WhatsApp.</p>
      <div class="cp-actions"><a href="/#citas" class="btn btn-red">Agendar una cita</a></div>
    </section>

    <p class="cp-foot">Venustiano Carranza, Chiapas · <a href="/">MOTOPARTES</a></p>
  </div>
</main>

<script src="/cal.js?v=20261108b"></script>
<script src="/cita.js?v=20261108b"></script>
</body>
</html>
