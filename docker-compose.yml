# Stack de motopartes-manager. El MISMO archivo sirve para local y para el
# servidor casero (servermacs); lo que cambia es el archivo .env de cada lado.
#
# Local (PC):
#   cp .env.example .env        (los valores por defecto ya funcionan)
#   docker compose up -d --build
#   -> http://localhost:5173 (app), http://localhost:3000/api/health,
#      http://localhost:3002/health
#
# Servidor: ademas del .env, se activa el tunel de Cloudflare con el perfil:
#   docker compose --profile tunnel up -d --build     (lo hace scripts/deploy.sh)
#   .env del servidor debe tener TUNNEL_TOKEN y CORS_ORIGINS con la URL Tailscale.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: motopartes
      POSTGRES_USER: motopartes
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MotoPartes2026!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motopartes"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://motopartes:${DB_PASSWORD:-MotoPartes2026!}@postgres:5432/motopartes
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-local-dev-bot-key}
      WHATSAPP_BOT_INTERNAL_URL: http://whatsapp-bot:3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  whatsapp-bot:
    build:
      context: .
      dockerfile: apps/whatsapp-bot/Dockerfile
    restart: unless-stopped
    # Al apagarse el bot cierra Chrome y se despide de WhatsApp (destroyAll, hasta
    # ~15 s por sesion). Con los 10 s por defecto Docker lo mataba a medias y
    # WhatsApp seguia viendo la sesion abierta, colgando el siguiente arranque.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      # La API crea/actualiza las tablas (prisma db push) al arrancar; el bot
      # restaura sesiones desde esas tablas, asi que debe esperar a la API.
      api:
        condition: service_healthy
    volumes:
      # Named volume in dev so the Chromium session survives rebuilds but
      # doesn't leak into the host. In production the bot uses a host bind
      # mount (/opt/whatsapp-sessions:/app/data) for the same purpose.
      - whatsapp-session:/app/data
    environment:
      DATABASE_URL: postgresql://motopartes:${DB_PASSWORD:-MotoPartes2026!}@postgres:5432/motopartes
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-local-dev-bot-key}
      PORT: 3002
      # Version fija: con "auto" el bot toma la ultima de WhatsApp Web, y la mas nueva
      # (2.3000.1053060988) rompe whatsapp-web.js ("reading Socket"). Si algun dia el
      # telefono rechaza el QR ("No se pudo vincular"), subir esta version.
      WWEBJS_WEB_VERSION: ${WWEBJS_WEB_VERSION:-2.3000.1053021455-alpha}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WHATSAPP_BOT_URL: /api/whatsapp-bot
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # nginx inside the container listens on 3000; map to 5173 so it doesn't
      # clash with the API's 3000 when both are running locally.
      - "5173:3000"

  landing-vc:
    build:
      context: ./apps/landing-vc
      dockerfile: Dockerfile
    restart: unless-stopped

  # Tunel de Cloudflare (solo servidor): publica motopartes.cloud -> frontend:3000
  # y vc.motopartes.cloud -> landing-vc:80 (las reglas se editan en el panel de
  # Cloudflare Zero Trust). --protocol http2 evita las caidas de QUIC/UDP que
  # reiniciaban el tunel cada pocos segundos.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - landing-vc

  # Panel de estado del servidor (CPU, RAM, disco, red, temperatura, procesos...).
  # SOLO LECTURA y generico (no depende de la app). Usa pid:host y network:host para
  # ver los procesos y las interfaces de red REALES del equipo, pero corre sin
  # privilegios: usuario no-root, sistema de archivos de solo lectura, sin capacidades
  # y sin el socket de Docker. En network:host no hay "ports": escucha en
  # MONITOR_BIND:MONITOR_PORT (por defecto 127.0.0.1:8088; en el servidor 0.0.0.0).
  server-monitor:
    build:
      context: ./apps/server-monitor
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      HOST_LABEL: ${MONITOR_HOST_LABEL:-}
      HOST_OS: ${MONITOR_HOST_OS:-}
      MONITOR_DEMO: ${MONITOR_DEMO:-0}
      LISTEN_HOST: ${MONITOR_BIND:-127.0.0.1}
      PORT: ${MONITOR_PORT:-8088}
    volumes:
      - monitor-data:/data

volumes:
  postgres-data:
  whatsapp-session:
  monitor-data:
